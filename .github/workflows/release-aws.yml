name: Release to AWS

# A push to main that changes the API, worker, database schema or
# infrastructure is released to AWS. `deploy.sh release` validates the deployed
# settings, stops the API and worker, applies the Supabase database migrations
# from a one-off ECS task, and restarts both services. Changes to only the web
# app or documentation ship through Vercel alone.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make verify

  release:
    name: Release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment's protection rules decide when production takes the
    # release's downtime; the AWS role trusts only jobs in this environment.
    environment: production
    # One release at a time. A running release is never cancelled, because
    # stopping it during migration would leave the services stopped.
    concurrency:
      group: aws-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: invook-release-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish the API and worker images
        run: ./infra/aws/scripts/deploy.sh publish "$GITHUB_SHA"
      - name: Migrate the database and start the release
        run: ./infra/aws/scripts/deploy.sh release "$GITHUB_SHA"
