name: Release to AWS

# A push to main that changes the API, worker, database schema or
# infrastructure is released to AWS. `deploy.sh release` validates the deployed
# settings, stops the API and worker, applies the Supabase database migrations
# from a one-off ECS task, and restarts both services. Changes to only the web
# app or documentation ship through Vercel alone.
#
# Each run releases the newest main commit when it starts, not the commit that
# triggered it, so a run that GitHub cancels while it waits never leaves a newer
# commit unreleased. Deliberate rollbacks stay manual with `deploy.sh release`.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, verification included, so each run sees the release the
# one before it made. A running release is never cancelled, because stopping
# it during migration would leave the services stopped.
concurrency:
  group: aws-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: target
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make verify

  release:
    name: Release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment's protection rules decide when production takes the
    # release's downtime; the AWS role trusts only jobs in this environment.
    # Vercel already uses `Production`, and environment names ignore case.
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          # The full history tells whether production already runs a newer commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: invook-release-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish, migrate the database and start the release
        run: ./infra/aws/scripts/deploy.sh release-commit "$RELEASE_COMMIT"
